<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malik Reminders - WhatsApp Business Connection</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: 80px auto;
      background: white;
      padding: 50px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 10px;
    }

    h2 {
      margin-top: 10px;
    }

    p {
      color: #555;
      font-size: 18px;
    }

    button {
      margin-top: 25px;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: #25D366;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      color: #666;
      font-size: 14px;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Malik Reminders</h1>

  <h2>WhatsApp Business Connection</h2>

  <p>
    Connect your WhatsApp Business App with Malik Reminders.
  </p>

  <button id="connectBtn" disabled>
    Loading Facebook SDK...
  </button>

  <div id="status">
    Initializing...
  </div>

</div>

<div id="fb-root"></div>

<script>

  let fbReady = false;

  /*
   * Listen for WhatsApp Embedded Signup events
   */
  window.addEventListener("message", function(event) {

    if (
      event.origin !== "https://www.facebook.com" &&
      event.origin !== "https://web.facebook.com"
    ) {
      return;
    }

    let data = event.data;

    try {
      if (typeof data === "string") {
        data = JSON.parse(data);
      }
    } catch (error) {
      console.log("Non-JSON Meta message:", event.data);
      return;
    }

    if (data && data.type === "WA_EMBEDDED_SIGNUP") {

      console.log("WhatsApp Embedded Signup event:", data);

      if (data.event === "FINISH") {

        const phoneNumberId =
          data.data?.phone_number_id || "";

        const wabaId =
          data.data?.waba_id || "";

        console.log("Phone Number ID:", phoneNumberId);
        console.log("WABA ID:", wabaId);

        document.getElementById("status").textContent =
          "WhatsApp Business connection completed successfully.";

      }

      else if (data.event === "CANCEL") {

        console.log("Embedded Signup cancelled:", data);

        document.getElementById("status").textContent =
          "WhatsApp Business connection was cancelled.";

      }

      else if (data.event === "ERROR") {

        console.error("Embedded Signup error:", data);

        document.getElementById("status").textContent =
          "An error occurred during WhatsApp Business connection.";

      }
    }

  });


  /*
   * Facebook SDK initialization
   */
  window.fbAsyncInit = function () {

    console.log("Facebook SDK initialization started.");

    FB.init({
      appId: "28649176571361297",
      cookie: true,
      xfbml: true,
      version: "v26.0"
    });

    fbReady = true;

    const btn =
      document.getElementById("connectBtn");

    const status =
      document.getElementById("status");

    btn.disabled = false;

    btn.textContent =
      "Connect WhatsApp Business App";

    status.textContent =
      "Facebook SDK ready.";

    console.log("Facebook SDK initialized.");
    console.log("App ID: 28649176571361297");
    console.log("FB.login:", typeof FB.login);

  };


  /*
   * Load Facebook JavaScript SDK
   */
  function loadFacebookSDK() {

    if (
      document.getElementById("facebook-jssdk")
    ) {
      return;
    }

    const js =
      document.createElement("script");

    js.id = "facebook-jssdk";

    js.src =
      "https://connect.facebook.net/en_US/sdk.js";

    js.async = true;
    js.defer = true;
    js.crossOrigin = "anonymous";

    js.onload = function () {

      console.log(
        "Facebook SDK script loaded."
      );

    };

    js.onerror = function (error) {

      console.error(
        "Facebook SDK failed to load:",
        error
      );

      document.getElementById("status")
        .textContent =
        "Facebook SDK failed to load.";

    };

    document.head.appendChild(js);

  }


  /*
   * Facebook Login callback
   */
  function fbLoginCallback(response) {

    console.log(
      "Facebook Login response:",
      response
    );

    if (
      response &&
      response.authResponse
    ) {

      const code =
        response.authResponse.code;

      console.log(
        "Authorization code:",
        code
      );

      document.getElementById("status")
        .textContent =
        "Facebook authorization completed. Waiting for WhatsApp setup to finish.";

    }

    else {

      console.log(
        "Embedded Signup cancelled or not completed."
      );

      document.getElementById("status")
        .textContent =
        "Connection was cancelled or not completed.";

    }
  }


  /*
   * Launch WhatsApp Embedded Signup
   */
  function launchWhatsAppSignup() {

    console.log(
      "Starting WhatsApp Embedded Signup..."
    );

    if (!fbReady) {

      console.error(
        "Facebook SDK is not ready yet."
      );

      document.getElementById("status")
        .textContent =
        "Facebook SDK is not ready yet.";

      return;
    }

    if (
      typeof FB === "undefined" ||
      typeof FB.login !== "function"
    ) {

      console.error(
        "FB.login is not available."
      );

      document.getElementById("status")
        .textContent =
        "Facebook Login is not available.";

      return;
    }

    console.log(
      "Using configuration ID:",
      "1378291321181333"
    );

    document.getElementById("status")
      .textContent =
      "Opening WhatsApp Business connection...";

    FB.login(
      fbLoginCallback,
      {
        config_id: "1378291321181333",

        response_type: "code",

        override_default_response_type: true,

        extras: {
          setup: {},

          featureType:
            "whatsapp_business_app_onboarding",

          sessionInfoVersion: "3"
        }
      }
    );
  }


  /*
   * Connect button
   */
  document
    .getElementById("connectBtn")
    .addEventListener(
      "click",
      launchWhatsAppSignup
    );


  /*
   * Start Facebook SDK
   */
  loadFacebookSDK();

</script>

</body>
</html>
